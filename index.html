
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0f0f">
  <title>Chicken</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0f0f;
      --panel: #181818;
      --panel-hover: #242424;
      --text: #f1f1f1;
      --muted: #aaa;
      --accent: #ff4545;
      --border: #303030;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 20px;
      min-height: 64px;
      padding: 10px 5%;
      background: rgba(15, 15, 15, .97);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -.8px;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      background: var(--accent);
      color: white;
      font-size: 19px;
    }

    .search {
      display: flex;
      width: min(600px, 100%);
      margin: 0 auto;
    }

    .search input {
      width: 100%;
      min-width: 0;
      padding: 12px 16px;
      color: var(--text);
      background: #121212;
      border: 1px solid #383838;
      border-radius: 24px 0 0 24px;
      outline: none;
    }

    .search input:focus {
      border-color: #777;
    }

    .search button {
      padding: 0 19px;
      color: white;
      background: #303030;
      border: 1px solid #383838;
      border-left: 0;
      border-radius: 0 24px 24px 0;
    }

    .main {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 28px 5%;
    }

    .section-heading {
      margin: 0 0 22px;
      font-size: 24px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 28px 18px;
    }

    .video-card {
      min-width: 0;
      cursor: pointer;
    }

    .thumbnail {
      display: grid;
      aspect-ratio: 16 / 9;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(145deg, #292929, #171717);
      border: 1px solid #303030;
      border-radius: 12px;
    }

    .thumbnail-letter {
      display: grid;
      width: 66px;
      height: 66px;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-size: 29px;
      font-weight: 800;
    }

    .video-card:hover .thumbnail {
      border-color: #656565;
    }

    .video-info {
      padding: 12px 3px;
    }

    .video-title {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .video-channel, .video-date {
      margin: 4px 0;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .notice {
      padding: 35px 12px;
      color: var(--muted);
      text-align: center;
    }

    .watch-page {
      width: min(1050px, 100%);
      margin: 0 auto;
    }

    .back-button {
      margin: 0 0 18px;
      padding: 10px 15px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
      border-radius: 12px;
    }

    .player iframe, .player video {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .player video {
      object-fit: contain;
    }

    .watch-title {
      margin: 20px 0 12px;
      font-size: clamp(21px, 3vw, 29px);
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .watch-channel {
      color: var(--muted);
      font-size: 14px;
    }

    .description {
      margin-top: 20px;
      padding: 18px;
      background: var(--panel);
      border-radius: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .external-fallback {
      display: flex;
      height: 100%;
      min-height: 180px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 25px;
      text-align: center;
    }

    .external-fallback p {
      margin: 0;
      color: #ccc;
      line-height: 1.5;
    }

    .open-link {
      display: inline-block;
      padding: 12px 19px;
      color: white;
      background: var(--accent);
      border-radius: 8px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .error {
      color: #ff8c8c;
    }

    @media (max-width: 600px) {
      .topbar {
        flex-wrap: wrap;
        gap: 12px;
        padding: 12px 4%;
      }

      .brand {
        font-size: 21px;
      }

      .search {
        order: 2;
        flex-basis: 100%;
      }

      .main {
        padding: 22px 4%;
      }

      .video-grid {
        grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
        gap: 16px 12px;
      }

      .thumbnail-letter {
        width: 52px;
        height: 52px;
        font-size: 24px;
      }

      .video-title {
        font-size: 14px;
      }

      .player {
        border-radius: 7px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Chicken home">
      <span class="brand-mark">C</span>
      <span>Chicken</span>
    </a>

    <form class="search" id="searchForm">
      <input
        id="searchInput"
        type="search"
        placeholder="Search videos"
        aria-label="Search videos"
      >
      <button type="submit" aria-label="Search">Search</button>
    </form>
  </header>

  <main class="main">
    <section id="homePage">
      <h1 class="section-heading" id="homeHeading">Videos</h1>
      <div id="videoGrid" class="video-grid">
        <div class="notice">Loading videos...</div>
      </div>
    </section>

    <section id="watchPage" class="watch-page" hidden>
      <button id="backButton" class="back-button" type="button">
        ← Back to videos
      </button>

      <div id="player" class="player"></div>
      <h1 id="watchTitle" class="watch-title"></h1>
      <div id="watchChannel" class="watch-channel"></div>
      <div id="watchDescription" class="description"></div>
    </section>
  </main>

  <script>
    "use strict";

    let videos = [];
    let currentSearch = "";

    const homePage = document.getElementById("homePage");
    const watchPage = document.getElementById("watchPage");
    const videoGrid = document.getElementById("videoGrid");
    const player = document.getElementById("player");

    function safeText(value) {
      return value == null ? "" : String(value);
    }

    function getVideoId(video) {
      return safeText(video?.id);
    }

    function getPlayableType(rawUrl) {
      try {
        const u = new URL(rawUrl);
        if (u.protocol !== "https:" && u.protocol !== "http:") {
          return { type: "link", url: rawUrl };
        }

        const host = u.hostname.toLowerCase().replace(/^www\./, "");
        const path = u.pathname;

        // YouTube videos, Shorts, live videos, and youtu.be links.
        if (
          host === "youtube.com" ||
          host.endsWith(".youtube.com") ||
          host === "youtube-nocookie.com" ||
          host.endsWith(".youtube-nocookie.com") ||
          host === "youtu.be"
        ) {
          let id = "";

          if (host === "youtu.be") {
            id = path.split("/").filter(Boolean)[0] || "";
          } else if (u.searchParams.has("v")) {
            id = u.searchParams.get("v") || "";
          } else {
            const match = path.match(
              /^\/(?:embed|shorts|live)\/([a-zA-Z0-9_-]+)/
            );
            if (match) id = match[1];
          }

          if (id) {
            return {
              type: "iframe",
              provider: "YouTube",
              src: "https://www.youtube-nocookie.com/embed/" +
                encodeURIComponent(id)
            };
          }
        }

        // Direct video files.
        if (/\.(mp4|webm|ogg|ogv|m4v|mov)(?:$)/i.test(path)) {
          return { type: "video", src: u.href };
        }

        // Reddit video links and Reddit post embeds.
        if (host === "reddit.com" || host.endsWith(".reddit.com")) {
          const videoMatch = path.match(/^\/video\/([a-zA-Z0-9_-]+)/);

          if (videoMatch) {
            return {
              type: "iframe",
              provider: "Reddit",
              src: "https://www.reddit.com/video/" +
                encodeURIComponent(videoMatch[1])
            };
          }

          if (/\/comments\/[a-zA-Z0-9]+/i.test(path)) {
            const redditEmbed = new URL(
              "https://www.redditmedia.com" + path
            );

            const postMatch = path.match(
              /\/comments\/([a-zA-Z0-9]+)/
            );

            if (postMatch) {
              redditEmbed.searchParams.set("ref_source", "embed");
              redditEmbed.searchParams.set("ref", "share");
              redditEmbed.searchParams.set("embed", "true");

              return {
                type: "iframe",
                provider: "Reddit",
                src: redditEmbed.href
              };
            }
          }
        }

        // Facebook videos, Watch pages, Reels, and fb.watch links.
        if (
          host === "facebook.com" ||
          host.endsWith(".facebook.com") ||
          host === "fb.watch"
        ) {
          if (
            host === "fb.watch" ||
            /\/(?:videos|watch|reel|reels|share\/v|share\/r)\//i.test(path)
          ) {
            return {
              type: "iframe",
              provider: "Facebook",
              src: "https://www.facebook.com/plugins/video.php?href=" +
                encodeURIComponent(u.href) +
                "&show_text=false"
            };
          }
        }

        // Pornhub videos.
        if (host === "pornhub.com" || host.endsWith(".pornhub.com")) {
          const videoId =
            u.searchParams.get("viewkey") ||
            path.match(/^\/embed\/([a-zA-Z0-9]+)/)?.[1];

          if (videoId) {
            return {
              type: "iframe",
              provider: "Pornhub",
              src: "https://www.pornhub.com/embed/" +
                encodeURIComponent(videoId)
            };
          }
        }

        // Generic video host: preserve the URL and provide an external link.
        return { type: "link", url: u.href };
      } catch {
        return { type: "link", url: rawUrl };
      }
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function formatDate(value) {
      if (!value) return "";

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";

      return date.toLocaleDateString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }

    function getInitial(video) {
      const thumbnailText = video?.thumbnail?.text;
      if (thumbnailText) return safeText(thumbnailText).slice(0, 2).toUpperCase();

      return safeText(video?.title).trim().charAt(0).toUpperCase() || "C";
    }

    function renderVideos() {
      videoGrid.replaceChildren();

      const filtered = videos.filter(video => {
        if (video.published === false) return false;

        const query = currentSearch.trim().toLowerCase();
        if (!query) return true;

        return [
          video.title,
          video.description,
          video.name
        ].some(value => safeText(value).toLowerCase().includes(query));
      });

      if (!filtered.length) {
        videoGrid.appendChild(
          makeElement(
            "div",
            "notice",
            currentSearch
              ? "No videos matched your search."
              : "No published videos yet."
          )
        );
        return;
      }

      for (const video of filtered) {
        const card = makeElement("article", "video-card");
        card.tabIndex = 0;
        card.setAttribute("role", "link");
        card.setAttribute(
          "aria-label",
          "Watch " + safeText(video.title || "video")
        );

        const thumbnail = makeElement("div", "thumbnail");
        const letter = makeElement("div", "thumbnail-letter", getInitial(video));
        thumbnail.appendChild(letter);

        const info = makeElement("div", "video-info");
        info.appendChild(
          makeElement("h2", "video-title", video.title || "Untitled video")
        );
        info.appendChild(
          makeElement("p", "video-channel", video.name || "Unknown creator")
        );

        const date = formatDate(video.createdAt || video.created_at);
        if (date) info.appendChild(makeElement("p", "video-date", date));

        card.append(thumbnail, info);

        const open = () => openWatchPage(getVideoId(video));
        card.addEventListener("click", open);
        card.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            open();
          }
        });

        videoGrid.appendChild(card);
      }
    }

    function showExternalFallback(url, providerName) {
      player.replaceChildren();

      const box = makeElement("div", "external-fallback");
      box.appendChild(
        makeElement(
          "p",
          "",
          providerName
            ? providerName + " may block playback in embedded players."
            : "This link does not provide an embeddable video player."
        )
      );

      const link = makeElement("a", "open-link", "Open video on its website");
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      box.appendChild(link);
      player.appendChild(box);
    }

    function renderVideoPlayer(video) {
      player.replaceChildren();

      const rawUrl = safeText(video.link || video.url).trim();

      if (!rawUrl) {
        player.appendChild(
          makeElement("div", "external-fallback", "This video has no link.")
        );
        return;
      }

      const playable = getPlayableType(rawUrl);

      if (playable.type === "video") {
        const media = document.createElement("video");
        media.src = playable.src;
        media.controls = true;
        media.autoplay = false;
        media.playsInline = true;
        media.preload = "metadata";
        media.onerror = () => showExternalFallback(rawUrl, "");
        player.appendChild(media);
        return;
      }

      if (playable.type === "iframe") {
        const iframe = document.createElement("iframe");

        iframe.src = playable.src;
        iframe.title = (playable.provider || "Video") + " player";
        iframe.allow =
          "autoplay; encrypted-media; picture-in-picture; fullscreen; clipboard-write";
        iframe.allowFullscreen = true;
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.loading = "eager";

        player.appendChild(iframe);

        // Cross-origin providers do not let this page reliably detect
        // blocked playback. Keep an explicit external fallback available.
        const fallback = makeElement("div", "external-fallback");
        fallback.style.position = "absolute";
        fallback.style.right = "8px";
        fallback.style.bottom = "8px";
        fallback.style.width = "auto";
        fallback.style.minHeight = "0";
        fallback.style.padding = "0";

        const link = makeElement("a", "open-link", "Open on website");
        link.href = rawUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.style.fontSize = "12px";
        link.style.padding = "8px 10px";

        fallback.appendChild(link);
        player.appendChild(fallback);
        return;
      }

      showExternalFallback(
        playable.url || rawUrl,
        playable.provider || ""
      );
    }

    function openWatchPage(id) {
      const video = videos.find(item => getVideoId(item) === id);

      if (!video) {
        homePage.hidden = false;
        watchPage.hidden = true;
        videoGrid.replaceChildren(
          makeElement("div", "notice error", "Video not found. It may have been removed or unpublished.")
        );
        history.replaceState({}, "", "/");
        return;
      }

      homePage.hidden = true;
      watchPage.hidden = false;

      document.getElementById("watchTitle").textContent =
        video.title || "Untitled video";

      document.getElementById("watchChannel").textContent =
        video.name || "Unknown creator";

      document.getElementById("watchDescription").textContent =
        video.description || "No description provided.";

      renderVideoPlayer(video);
      document.title = (video.title || "Watch video") + " - Chicken";
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function showHome() {
      watchPage.hidden = true;
      homePage.hidden = false;
      document.title = "Chicken";
      history.pushState({}, "", "/");
      renderVideos();
    }

    async function loadVideos() {
      try {
        const response = await fetch("/api/videos", {
          headers: { "Accept": "application/json" },
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Video API returned HTTP " + response.status);
        }

        const data = await response.json();

        // Accept either an array or a common { videos: [...] } response.
        videos = Array.isArray(data)
          ? data
          : Array.isArray(data.videos)
            ? data.videos
            : [];

        renderVideos();

        const watchId = new URLSearchParams(location.search).get("watch");
        if (watchId) {
          openWatchPage(watchId);
        }
      } catch (error) {
        console.error("Could not load Chicken videos:", error);

        videoGrid.replaceChildren(
          makeElement(
            "div",
            "notice error",
            "Could not load videos. Check that /api/videos is working."
          )
        );
      }
    }

    document.getElementById("searchForm").addEventListener("submit", event => {
      event.preventDefault();
      currentSearch = document.getElementById("searchInput").value;
      renderVideos();
    });

    document.getElementById("searchInput").addEventListener("input", event => {
      currentSearch = event.target.value;
      renderVideos();
    });

    document.getElementById("backButton").addEventListener("click", showHome);

    window.addEventListener("popstate", () => {
      const watchId = new URLSearchParams(location.search).get("watch");

      if (watchId) {
        openWatchPage(watchId);
      } else {
        watchPage.hidden = true;
        homePage.hidden = false;
        document.title = "Chicken";
        renderVideos();
      }
    });

    loadVideos();

    // Refresh the video list without forcing a reload of an open player.
    setInterval(async () => {
      try {
        const response = await fetch("/api/videos", {
          headers: { "Accept": "application/json" },
          cache: "no-store"
        });

        if (!response.ok) return;

        const data = await response.json();
        videos = Array.isArray(data)
          ? data
          : Array.isArray(data.videos)
            ? data.videos
            : [];

        if (watchPage.hidden) renderVideos();
      } catch (error) {
        console.warn("Chicken background refresh failed:", error);
      }
    }, 15000);
  </script>
</body>
</html>
